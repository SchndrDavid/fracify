name: fracify

services:
  fracify:
    build: .
    image: fracify
    container_name: fracify
    restart: unless-stopped

    user: "${FRACIFY_UID:-1000}:${FRACIFY_GID:-1000}"

    ports:
      - "${FRACIFY_PORT:-8105}:8000"

    environment:
      PORT: 8000

    # python:3.12-slim ships neither curl nor wget, so the probe asks the
    # interpreter that is already in the image.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,sys,urllib.request; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:%s/api/health" % os.environ.get("PORT", "8000"), timeout=2).status == 200 else 1)
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
